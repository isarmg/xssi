name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: {}

# Superseded branch/PR CI can stop; release and manual runs stay independent.
concurrency:
  group: xssi-ci-${{ github.workflow }}-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')) }}
jobs:
  foundation-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify declared Linux helper against exact official foundation source
        run: python3 scripts/verify-foundation.py
  windows-producer-boundaries:
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the exact native MSI inspection tool
        shell: pwsh
        run: dotnet tool install --global wix --version 4.0.6
      - name: Install verified CMake for actual copyright output
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'cmake-3.31.3-windows-x86_64.zip'
          curl.exe --fail --location --retry 3 --proto '=https' --output $archive https://github.com/Kitware/CMake/releases/download/v3.31.3/cmake-3.31.3-windows-x86_64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne 'd41e863589a3c152b1d14ecac2ffd1926f29aba64528984fcda8fd2b630f44ff') { throw 'CMake SHA256 differs from its official asset' }
          $destination = Join-Path $env:RUNNER_TEMP 'xssi-cmake-3.31.3'
          if (Test-Path $destination) { throw 'CMake requires a fresh private tool directory' }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          Add-Content -Encoding utf8 $env:GITHUB_PATH (Join-Path $destination 'cmake-3.31.3-windows-x86_64/bin')
      - name: Test actual Windows process trees and regular-file readers
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_sbom_process.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_gradle_sbom.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_upstream_licenses.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_bounded_reader.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_windows_inventory.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_native_process.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_msi_policy.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_static_native_windows.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
          check-latest: false
      - name: Install verified native package test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools
          archive="$RUNNER_TEMP/nfpm-2.47.0.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --output "$archive" https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
          printf '%s  %s\n' 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783 "$archive" | sha256sum --check -
          mkdir -m 0700 "$RUNNER_TEMP/native-package-tools"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/native-package-tools" --no-same-owner nfpm
          sudo install -m 0755 "$RUNNER_TEMP/native-package-tools/nfpm" /usr/local/bin/nfpm
      - name: Validate scripts and SHA256 transactions
        run: |
          python3 -m py_compile scripts/*.py
          bash -n install.sh maintenance.sh upgrade.sh scripts/build-package.sh
          sudo -- /usr/bin/env -i PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 TMPDIR=/tmp /usr/bin/python3 -m unittest discover -s tests -v
          node scripts/generate-third-party-notices.mjs --self-test
          node --test tests/frontend_build.test.mjs
  dependency-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
          check-latest: false
      - name: Install locked dependency tools
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo install cargo-audit --version 0.22.2 --locked
      - name: Exercise actual transitive inventories and license failures
        run: python3 scripts/tests/verify-sbom-producer.py
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - name: Validate helper core
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/xssi-test-messages.jsonl"
          python3 scripts/run-root-tests.py "$RUNNER_TEMP/xssi-test-messages.jsonl"
          python3 -m unittest discover -s tests -p test_compiler_artifact.py -v
